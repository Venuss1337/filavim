name: Rust
on: [push, pull_request]
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux GPUI libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libwayland-dev libxkbcommon-x11-dev libssl-dev libxcb1-dev libxcb-xkb-dev libx11-xcb-dev libvulkan-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo test --no-default-features --locked
      - name: Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows-build.ps1 -Release
      - name: Unix release
        if: runner.os != 'Windows'
        run: cargo build --release --locked
