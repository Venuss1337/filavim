name: Rust
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_BUILD_JOBS: 2
  RUST_TEST_THREADS: 2
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-${{ runner.os }}
      - shell: pwsh
        run: ./scripts/test.ps1 -Mode Full -CoreOnly
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-reports-${{ runner.os }}
          path: |
            target/test-reports/
            tests/proptest-regressions.txt
          if-no-files-found: ignore
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gpui-windows
      - shell: pwsh
        run: ./scripts/test.ps1 -Mode Full
      - name: Native release compile (no interactive desktop required)
        shell: pwsh
        run: ./scripts/windows-build.ps1 -Release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-reports
          path: |
            target/test-reports/
            tests/proptest-regressions.txt
          if-no-files-found: ignore
