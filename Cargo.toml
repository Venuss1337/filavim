[package]
name = "filavim"
version = "0.4.0"
edition = "2024"
license = "GPL-3.0-only"
exclude = [".local/**"]
autotests = false
autoexamples = false
build = false

[features]
default = ["native"]
native = ["dep:gpui"]

[[bin]]
name = "filavim"
path = "src/main.rs"
required-features = ["native"]

[dependencies]
anyhow = "1"
gpui = { version = "=0.2.2", optional = true }
ropey = "1.6"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
unicode-segmentation = "1.12"
unicode-width = "0.2"
tempfile = "3"
lsp-types = "0.97"
tree-sitter = "0.26"
bitflags = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[dev-dependencies]
ttf-parser = "0.25"

[[test]]
name = "editor"
path = "tests/editor.rs"

[[test]]
name = "native"
path = "tests/native.rs"

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
