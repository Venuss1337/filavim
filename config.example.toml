# All settings are optional. No config file is needed for the default experience.
tab_width = 4
expand_tabs = true
auto_indent = true
line_numbers = true
unicode = true
clipboard_osc52 = true
preset = "balanced" # beautiful | balanced | minimal
syntax = true
syntax_max_bytes = 2097152

# Omitted animation settings inherit the selected preset independently.
[visual]
# cursor_animation = true
# smooth_scroll = false
# trail_intensity = 7 # 0..10; 10 uses the upstream default gradient
# fps = 60 # 1..240; both Beautiful and Balanced default to 60
scroll_duration_ms = 120
easing = "cubic" # linear | quadratic | cubic
colors = "auto" # auto | truecolor | indexed | ansi
cursor_effect = "auto" # auto | pixiedust | smear | off; unsupported graphics use smear

[visual.pixiedust]
density = 0.7 # particles per cursor-height traveled; 0..4
lifetime_ms = 500 # 100..1500
fps = 60 # 10..120, also limited by visual.fps / preset FPS

# Native four-corner spring smear, only while navigating in Normal mode.
# Defaults follow smear-cursor.nvim. Omit frame_interval_ms to inherit preset FPS.
[visual.smear]
# frame_interval_ms = 8 # 4..1000; overrides fps; omit for preset pacing
stiffness = 0.6
trailing_stiffness = 0.45
damping = 0.85
anticipation = 0.2
trailing_exponent = 3.0
max_length = 25.0
gradient_exponent = 1.0
# color = "#c4a7e7" # omitted: theme Iris
quality = "blocks" # blocks | legacy | ascii | native

[navigation]
show_hidden = false
respect_ignore = true
max_files = 200000
max_results = 300
grep_max_bytes = 8388608
preview_max_bytes = 524288
debounce_ms = 60
explorer_width = 28

# Override any official Rosé Pine Moon token with a #rrggbb value.
[theme]
# base = "#232136"
# iris = "#c4a7e7"

# Mode-specific overrides. Existing defaults remain unless overridden with noop.
# Use lowercase key names. Uppercase letters use shift-i, shift-g, etc.
[keybindings.normal]
# "space z" = "save"
# f = "word_forward"
# e = "noop"

[keybindings.insert]
# "ctrl-u" = "undo"

[keybindings.visual]
# "ctrl-c" = "copy"

[keybindings.command]
# "ctrl-g" = "normal"

[keybindings.picker]
# "ctrl-j" = "down"
# "ctrl-k" = "up"

[keybindings.explorer]
# "ctrl-f" = "find_files"

[keybindings.dialog]
# "ctrl-g" = "normal"

# Stage 3: defaults start installed servers lazily, never install them automatically.
[lsp]
enabled = true
auto_start = true
debounce_ms = 120
timeout_ms = 10000
# Defining [[lsp.servers]] replaces the default registry. Include each server needed.
# [[lsp.servers]]
# name = "rust"
# command = "rust-analyzer"
# args = []
# languages = ["rust"]
# enabled = true
# initialization_options = {}

[git]
enabled = true # requires Git on PATH
debounce_ms = 400
refresh_ms = 5000

[terminal]
enabled = true
# shell = "pwsh.exe" # omitted: COMSPEC on Windows, SHELL or /bin/sh on Unix
args = []
scrollback = 2000
height = 12

# Native numbered snippet fields; Tab advances, $0 is the final cursor position.
[snippets.rust]
# dbg = 'dbg!(${1:value});$0'
